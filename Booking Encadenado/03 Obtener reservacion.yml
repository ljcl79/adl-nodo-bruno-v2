info:
  name: 03 Obtener reservacion
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/booking/{{bookingId}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.status).to.equal(200)
        })

        test("Es la reservación creada", function () {
          expect(res.body.firstname).to.equal("Jim")
          expect(res.body.additionalneeds).to.equal("Breakfast")
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
