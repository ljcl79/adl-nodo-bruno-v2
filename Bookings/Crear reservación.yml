info:
  name: Crear reservación
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/booking"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstname": "{{firstName}}",
        "lastname": "{{lastName}}",
        "totalprice": {{totalPrice}},
        "depositpaid": {{depositPaid}},
        "bookingdates": {
          "checkin": "2018-01-01",
          "checkout": "2019-01-01"
        },
        "additionalneeds": "Breakfast"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const columnas = ['firstname','lastname','totalprice','depositpaid'];
        const variables = ['firstName','lastName','totalPrice','depositPaid'];

        for(i = 0;i < columnas.length;i++) {
          bru.setEnvVar(variables[i], bru.runner.iterationData.get(columnas[i])); 
        }

        /*
        bru.setEnvVar("lastName", bru.runner.iterationData.get("lastname"));
        bru.setEnvVar("totalPrice", bru.runner.iterationData.get("totalprice"));
        bru.setEnvVar("depositPaid", bru.runner.iterationData.get("depositpaid")
        */
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.bookingid) {
          bru.setEnvVar('bookingid', res.body?.bookingid);
        }
    - type: tests
      code: |-
        test("Validar reserva", () => {
          if (!req.body.totalprice) {
            expect(res.getStatus()).to.equal(400);
          }
          else {
            expect(res.getStatus()).to.equal(201);
            expect(res.getBody()).to.have.property("booking");
            expect(res.body.booking).to.be.an("object");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
